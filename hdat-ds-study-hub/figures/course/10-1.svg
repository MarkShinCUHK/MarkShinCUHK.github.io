<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="figure-10-1-title figure-10-1-desc"><title id="figure-10-1-title">회귀: 관측값과 선 사이의 차이를 줄인다</title><desc id="figure-10-1-desc">예측선은 y=2x+1이고 관측점은 (0,1), (1,2), (2,5), (3,8)이다. 각 관측점과 예측선 사이의 세로 차이가 잔차를 나타낸다.</desc><rect width="360" height="260" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><line x1="50" y1="33" x2="50" y2="207" stroke="#64748b" stroke-width="2"/><line x1="50" y1="207" x2="330" y2="207" stroke="#64748b" stroke-width="2"/><text x="190" y="248" text-anchor="middle" font-size="16"><tspan x="190" dy="0">입력 x</tspan></text><text x="12" y="22" text-anchor="start" font-size="16"><tspan x="12" dy="0">정답 y</tspan></text><line x1="50" y1="207" x2="50" y2="212" stroke="#64748b" stroke-width="2"/><text x="50" y="230" text-anchor="middle" font-size="16"><tspan x="50" dy="0">0</tspan></text><line x1="143.33333333333331" y1="207" x2="143.33333333333331" y2="212" stroke="#64748b" stroke-width="2"/><text x="143.33333333333331" y="230" text-anchor="middle" font-size="16"><tspan x="143.33333333333331" dy="0">1</tspan></text><line x1="236.66666666666666" y1="207" x2="236.66666666666666" y2="212" stroke="#64748b" stroke-width="2"/><text x="236.66666666666666" y="230" text-anchor="middle" font-size="16"><tspan x="236.66666666666666" dy="0">2</tspan></text><line x1="330" y1="207" x2="330" y2="212" stroke="#64748b" stroke-width="2"/><text x="330" y="230" text-anchor="middle" font-size="16"><tspan x="330" dy="0">3</tspan></text><line x1="45" y1="207" x2="50" y2="207" stroke="#64748b" stroke-width="2"/><text x="41" y="212" text-anchor="end" font-size="16"><tspan x="41" dy="0">0</tspan></text><line x1="45" y1="149" x2="50" y2="149" stroke="#64748b" stroke-width="2"/><text x="41" y="154" text-anchor="end" font-size="16"><tspan x="41" dy="0">3</tspan></text><line x1="45" y1="91" x2="50" y2="91" stroke="#64748b" stroke-width="2"/><text x="41" y="96" text-anchor="end" font-size="16"><tspan x="41" dy="0">6</tspan></text><line x1="45" y1="33" x2="50" y2="33" stroke="#64748b" stroke-width="2"/><text x="41" y="38" text-anchor="end" font-size="16"><tspan x="41" dy="0">9</tspan></text><path d="M50,187.66666666666666 L330,71.66666666666666" fill="none" stroke="#1768df" stroke-width="3"/><circle cx="50" cy="187.66666666666666" r="5" fill="#1768df"/><circle cx="143.33333333333331" cy="168.33333333333334" r="5" fill="#1768df"/><circle cx="236.66666666666666" cy="110.33333333333333" r="5" fill="#1768df"/><circle cx="330" cy="52.33333333333334" r="5" fill="#1768df"/><line x1="143.33333333333331" y1="168.33333333333334" x2="143.33333333333331" y2="149" stroke="#b44a2d" stroke-width="2" stroke-dasharray="4 3"/><line x1="330" y1="52.33333333333334" x2="330" y2="71.66666666666666" stroke="#b44a2d" stroke-width="2" stroke-dasharray="4 3"/></g></svg>