<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="figure-23-1-title figure-23-1-desc"><title id="figure-23-1-title">attention의 한 행은 무엇을 볼지 정한다</title><desc id="figure-23-1-desc">한query의QK점수[2,0]을softmax하면약[.881,.119]. 두value[10,20]가중합은11.19.</desc><rect width="360" height="260" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="180" y="29" text-anchor="middle" font-size="16"><tspan x="180" dy="0">점수 → 비중 → value</tspan></text><rect x="64" y="45" width="113" height="43" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="120.5" y="73" text-anchor="middle" font-size="16"><tspan x="120.5" dy="0">2</tspan></text><rect x="180" y="45" width="113" height="43" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="236.5" y="73" text-anchor="middle" font-size="16"><tspan x="236.5" dy="0">0</tspan></text><rect x="64" y="91" width="113" height="43" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="120.5" y="119" text-anchor="middle" font-size="16"><tspan x="120.5" dy="0">0.881</tspan></text><rect x="180" y="91" width="113" height="43" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="236.5" y="119" text-anchor="middle" font-size="16"><tspan x="236.5" dy="0">0.119</tspan></text><rect x="64" y="137" width="113" height="43" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="120.5" y="165" text-anchor="middle" font-size="16"><tspan x="120.5" dy="0">10</tspan></text><rect x="180" y="137" width="113" height="43" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="236.5" y="165" text-anchor="middle" font-size="16"><tspan x="236.5" dy="0">20</tspan></text><text x="180" y="221" text-anchor="middle" font-size="16"><tspan x="180" dy="0">0.881×10 + 0.119×20 ≈ 11.19</tspan></text></g></svg>