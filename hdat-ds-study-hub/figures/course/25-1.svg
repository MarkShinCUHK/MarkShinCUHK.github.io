<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 300" role="img" aria-labelledby="figure-25-1-title figure-25-1-desc"><title id="figure-25-1-title">VAE는 점이 아니라 분포를 만든다</title><desc id="figure-25-1-desc">인코더가 평균과 로그 분산을 출력한다. 표준정규분포에서 뽑은 잡음으로 잠재변수 z를 만들고, 디코더의 복원 오차와 KL 항을 더해 학습한다.</desc><rect width="360" height="300" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="28" y="14" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="39" text-anchor="middle" font-size="16"><tspan x="180" dy="0">encoder(x) → μ, log σ²</tspan></text><rect x="28" y="70" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="95" text-anchor="middle" font-size="16"><tspan x="180" dy="0">ε ~ N(0,I)</tspan></text><line x1="180" y1="53" x2="180" y2="68" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,61.85692206676739 L180,68 L183.35597877022943,61.85692206676739" fill="none" stroke="#64748b" stroke-width="3"/><rect x="28" y="126" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="151" text-anchor="middle" font-size="16"><tspan x="180" dy="0">z = μ + σ × ε</tspan></text><line x1="180" y1="109" x2="180" y2="124" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,117.8569220667674 L180,124 L183.35597877022943,117.8569220667674" fill="none" stroke="#64748b" stroke-width="3"/><rect x="28" y="182" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="207" text-anchor="middle" font-size="16"><tspan x="180" dy="0">decoder(z) → 복원 오차</tspan></text><line x1="180" y1="165" x2="180" y2="180" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,173.8569220667674 L180,180 L183.35597877022943,173.8569220667674" fill="none" stroke="#64748b" stroke-width="3"/><rect x="28" y="238" width="304" height="39" rx="5" fill="#e6f7f1" stroke="#168765"/><text x="180" y="263" text-anchor="middle" font-size="16"><tspan x="180" dy="0">μ, log σ² → KL; 두 손실 합산</tspan></text><line x1="180" y1="221" x2="180" y2="236" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,229.8569220667674 L180,236 L183.35597877022943,229.8569220667674" fill="none" stroke="#64748b" stroke-width="3"/></g></svg>