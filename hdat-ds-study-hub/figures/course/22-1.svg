<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="figure-22-1-title figure-22-1-desc"><title id="figure-22-1-title">RNN을 시간축으로 펼쳐 보기</title><desc id="figure-22-1-desc">첫 입력 x₁로 h₁을 계산하고, 다음 입력 x₂와 h₁으로 h₂를 계산한 뒤 같은 방식으로 h₃을 구한다. 모든 시점에서 같은 가중치를 사용한다.</desc><rect width="360" height="260" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="32" y="105" width="66" height="44" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="65" y="133" text-anchor="middle" font-size="16"><tspan x="65" dy="0">h1</tspan></text><text x="65" y="218" text-anchor="middle" font-size="16"><tspan x="65" dy="0">x1</tspan></text><line x1="65" y1="194" x2="65" y2="151" stroke="#64748b" stroke-width="2"/><path d="M68.35597877022943,157.1430779332326 L65,151 L61.64402122977058,157.1430779332326" fill="none" stroke="#64748b" stroke-width="3"/><rect x="147" y="105" width="66" height="44" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="133" text-anchor="middle" font-size="16"><tspan x="180" dy="0">h2</tspan></text><text x="180" y="218" text-anchor="middle" font-size="16"><tspan x="180" dy="0">x2</tspan></text><line x1="180" y1="194" x2="180" y2="151" stroke="#64748b" stroke-width="2"/><path d="M183.35597877022943,157.1430779332326 L180,151 L176.64402122977057,157.1430779332326" fill="none" stroke="#64748b" stroke-width="3"/><line x1="99" y1="127" x2="144" y2="127" stroke="#64748b" stroke-width="2"/><path d="M137.8569220667674,130.35597877022943 L144,127 L137.8569220667674,123.64402122977057" fill="none" stroke="#64748b" stroke-width="3"/><rect x="262" y="105" width="66" height="44" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="295" y="133" text-anchor="middle" font-size="16"><tspan x="295" dy="0">h3</tspan></text><text x="295" y="218" text-anchor="middle" font-size="16"><tspan x="295" dy="0">x3</tspan></text><line x1="295" y1="194" x2="295" y2="151" stroke="#64748b" stroke-width="2"/><path d="M298.3559787702294,157.1430779332326 L295,151 L291.6440212297706,157.1430779332326" fill="none" stroke="#64748b" stroke-width="3"/><line x1="214" y1="127" x2="259" y2="127" stroke="#64748b" stroke-width="2"/><path d="M252.8569220667674,130.35597877022943 L259,127 L252.8569220667674,123.64402122977057" fill="none" stroke="#64748b" stroke-width="3"/><text x="180" y="40" text-anchor="middle" font-size="16"><tspan x="180" dy="0">시간마다 같은 W를 재사용</tspan></text><text x="180" y="75" text-anchor="middle" font-size="16"><tspan x="180" dy="0">hₜ = tanh(Wₓxₜ + Wₕhₜ₋₁ + b)</tspan></text></g></svg>