<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="figure-02-1-title figure-02-1-desc"><title id="figure-02-1-title">행·열에서 배치·시간·특성으로</title><desc id="figure-02-1-desc">B=1, T=3, F=2. 행은 시간, 열은 특성. permute 후 같은 특성이 같은 행에 모인다.</desc><rect width="360" height="260" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="180" y="29" text-anchor="middle" font-size="16"><tspan x="180" dy="0">[B=1, T=3, F=2]</tspan></text><rect x="80" y="45" width="97" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="128.5" y="73" text-anchor="middle" font-size="16"><tspan x="128.5" dy="0">1</tspan></text><rect x="180" y="45" width="97" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="228.5" y="73" text-anchor="middle" font-size="16"><tspan x="228.5" dy="0">10</tspan></text><rect x="80" y="90" width="97" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="128.5" y="118" text-anchor="middle" font-size="16"><tspan x="128.5" dy="0">2</tspan></text><rect x="180" y="90" width="97" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="228.5" y="118" text-anchor="middle" font-size="16"><tspan x="228.5" dy="0">20</tspan></text><rect x="80" y="135" width="97" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="128.5" y="163" text-anchor="middle" font-size="16"><tspan x="128.5" dy="0">3</tspan></text><rect x="180" y="135" width="97" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="228.5" y="163" text-anchor="middle" font-size="16"><tspan x="228.5" dy="0">30</tspan></text><text x="180" y="217" text-anchor="middle" font-size="16"><tspan x="180" dy="0">A: 1 → 2 → 3</tspan></text><text x="180" y="245" text-anchor="middle" font-size="16"><tspan x="180" dy="0">B: 10 → 20 → 30</tspan></text></g></svg>