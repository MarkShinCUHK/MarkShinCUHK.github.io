<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="figure-23-2-title figure-23-2-desc"><title id="figure-23-2-title">인과적 마스크는 미래 시점의 열을 가린다</title><desc id="figure-23-2-desc">행은 쿼리 시점, 열은 키 시점이다. 첫 시점은 첫 열만, 두 번째 시점은 첫 두 열만, 세 번째 시점은 세 열 모두를 볼 수 있다.</desc><rect width="360" height="260" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="180" y="29" text-anchor="middle" font-size="16"><tspan x="180" dy="0">행=query / 열=key</tspan></text><rect x="68" y="45" width="72" height="45" rx="5" fill="#d9eaff" stroke="#1768df"/><text x="104" y="73" text-anchor="middle" font-size="16"><tspan x="104" dy="0">✓</tspan></text><rect x="143" y="45" width="72" height="45" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="179" y="73" text-anchor="middle" font-size="16"><tspan x="179" dy="0">×</tspan></text><rect x="218" y="45" width="72" height="45" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="254" y="73" text-anchor="middle" font-size="16"><tspan x="254" dy="0">×</tspan></text><rect x="68" y="93" width="72" height="45" rx="5" fill="#d9eaff" stroke="#1768df"/><text x="104" y="121" text-anchor="middle" font-size="16"><tspan x="104" dy="0">✓</tspan></text><rect x="143" y="93" width="72" height="45" rx="5" fill="#d9eaff" stroke="#1768df"/><text x="179" y="121" text-anchor="middle" font-size="16"><tspan x="179" dy="0">✓</tspan></text><rect x="218" y="93" width="72" height="45" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="254" y="121" text-anchor="middle" font-size="16"><tspan x="254" dy="0">×</tspan></text><rect x="68" y="141" width="72" height="45" rx="5" fill="#d9eaff" stroke="#1768df"/><text x="104" y="169" text-anchor="middle" font-size="16"><tspan x="104" dy="0">✓</tspan></text><rect x="143" y="141" width="72" height="45" rx="5" fill="#d9eaff" stroke="#1768df"/><text x="179" y="169" text-anchor="middle" font-size="16"><tspan x="179" dy="0">✓</tspan></text><rect x="218" y="141" width="72" height="45" rx="5" fill="#d9eaff" stroke="#1768df"/><text x="254" y="169" text-anchor="middle" font-size="16"><tspan x="254" dy="0">✓</tspan></text><text x="180" y="230" text-anchor="middle" font-size="16"><tspan x="180" dy="0">미래를 보는 오른쪽 위 삼각형 차단</tspan></text></g></svg>