<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 275" role="img" aria-labelledby="figure-20-1-title figure-20-1-desc"><title id="figure-20-1-title">Residual: F(x)에 입력 x를 더한다</title><desc id="figure-20-1-desc">입력x가블록F를통과하는경로와우회하는경로로나뉜뒤덧셈한다. shape가같아야직접더할수있다.</desc><rect width="360" height="275" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="110" y="20" width="140" height="38" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="45" text-anchor="middle" font-size="16"><tspan x="180" dy="0">입력 x</tspan></text><line x1="180" y1="60" x2="180" y2="94" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,87.8569220667674 L180,94 L183.35597877022943,87.8569220667674" fill="none" stroke="#64748b" stroke-width="3"/><rect x="110" y="98" width="140" height="40" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="125" text-anchor="middle" font-size="16"><tspan x="180" dy="0">F(x)</tspan></text><line x1="180" y1="139" x2="180" y2="179" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,172.8569220667674 L180,179 L183.35597877022943,172.8569220667674" fill="none" stroke="#64748b" stroke-width="3"/><circle cx="180" cy="195" r="18" fill="#168765"/><text x="180" y="201" text-anchor="middle" font-size="16"><tspan x="180" dy="0">+</tspan></text><path d="M110,39 L45,39 L45,195 L161,195" fill="none" stroke="#b44a2d" stroke-width="3"/><text x="43" y="126" text-anchor="middle" font-size="16"><tspan x="43" dy="0">x</tspan></text><line x1="180" y1="215" x2="180" y2="237" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,230.8569220667674 L180,237 L183.35597877022943,230.8569220667674" fill="none" stroke="#64748b" stroke-width="3"/><text x="180" y="257" text-anchor="middle" font-size="16"><tspan x="180" dy="0">출력 F(x)+x</tspan></text></g></svg>