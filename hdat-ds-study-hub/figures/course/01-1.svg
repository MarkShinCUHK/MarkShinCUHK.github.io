<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 244" role="img" aria-labelledby="figure-01-1-title figure-01-1-desc"><title id="figure-01-1-title">필기와 실기는 서로 다른 행동을 확인한다</title><desc id="figure-01-1-desc">개념 설명, 작은 수식과 코드로 확인, 문제 요구사항 구현, 시간 안에 저장과 제출의 순서로 공부한다.</desc><rect width="360" height="244" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="28" y="14" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="39" text-anchor="middle" font-size="16"><tspan x="180" dy="0">개념을 말로 설명</tspan></text><rect x="28" y="70" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="95" text-anchor="middle" font-size="16"><tspan x="180" dy="0">작은 수식·코드로 확인</tspan></text><line x1="180" y1="53" x2="180" y2="68" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,61.85692206676739 L180,68 L183.35597877022943,61.85692206676739" fill="none" stroke="#64748b" stroke-width="3"/><rect x="28" y="126" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="151" text-anchor="middle" font-size="16"><tspan x="180" dy="0">문제 명세에 맞게 구현</tspan></text><line x1="180" y1="109" x2="180" y2="124" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,117.8569220667674 L180,124 L183.35597877022943,117.8569220667674" fill="none" stroke="#64748b" stroke-width="3"/><rect x="28" y="182" width="304" height="39" rx="5" fill="#e6f7f1" stroke="#168765"/><text x="180" y="207" text-anchor="middle" font-size="16"><tspan x="180" dy="0">시간 안에 저장·제출</tspan></text><line x1="180" y1="165" x2="180" y2="180" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,173.8569220667674 L180,180 L183.35597877022943,173.8569220667674" fill="none" stroke="#64748b" stroke-width="3"/></g></svg>