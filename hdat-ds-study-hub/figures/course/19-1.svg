<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="figure-19-1-title figure-19-1-desc"><title id="figure-19-1-title">2×2 필터가 처음 보는 창</title><desc id="figure-19-1-desc">1부터 9까지 담은 3×3 입력에서 첫 2×2 영역의 값은 1, 2, 4, 5다. 필터 [[1,0],[0,1]]를 뒤집지 않고 적용하면 첫 출력은 6이다. PyTorch의 상호상관 계산 방식이다.</desc><rect width="360" height="260" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="180" y="29" text-anchor="middle" font-size="16"><tspan x="180" dy="0">입력 3×3 · 파랑은 첫 창</tspan></text><rect x="75" y="45" width="67" height="42" rx="5" fill="#d9eaff" stroke="#1768df"/><text x="108.5" y="73" text-anchor="middle" font-size="16"><tspan x="108.5" dy="0">1</tspan></text><rect x="145" y="45" width="67" height="42" rx="5" fill="#d9eaff" stroke="#1768df"/><text x="178.5" y="73" text-anchor="middle" font-size="16"><tspan x="178.5" dy="0">2</tspan></text><rect x="215" y="45" width="67" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="248.5" y="73" text-anchor="middle" font-size="16"><tspan x="248.5" dy="0">3</tspan></text><rect x="75" y="90" width="67" height="42" rx="5" fill="#d9eaff" stroke="#1768df"/><text x="108.5" y="118" text-anchor="middle" font-size="16"><tspan x="108.5" dy="0">4</tspan></text><rect x="145" y="90" width="67" height="42" rx="5" fill="#d9eaff" stroke="#1768df"/><text x="178.5" y="118" text-anchor="middle" font-size="16"><tspan x="178.5" dy="0">5</tspan></text><rect x="215" y="90" width="67" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="248.5" y="118" text-anchor="middle" font-size="16"><tspan x="248.5" dy="0">6</tspan></text><rect x="75" y="135" width="67" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="108.5" y="163" text-anchor="middle" font-size="16"><tspan x="108.5" dy="0">7</tspan></text><rect x="145" y="135" width="67" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="178.5" y="163" text-anchor="middle" font-size="16"><tspan x="178.5" dy="0">8</tspan></text><rect x="215" y="135" width="67" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="248.5" y="163" text-anchor="middle" font-size="16"><tspan x="248.5" dy="0">9</tspan></text><text x="180" y="218" text-anchor="middle" font-size="16"><tspan x="180" dy="0">1×1 + 2×0 + 4×0 + 5×1 = 6</tspan></text></g></svg>