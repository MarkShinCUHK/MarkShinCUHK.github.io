<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="figure-33-1-title figure-33-1-desc"><title id="figure-33-1-title">다중출력은 행도 열도 대응해야 한다</title><desc id="figure-33-1-desc">샘플 3개에 정답 열이 2개인 다중출력 예시다. 각 행은 샘플 하나, 각 열은 서로 다른 예측 대상을 나타내므로 행과 열의 순서를 모두 맞춰야 한다.</desc><rect width="360" height="260" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="180" y="29" text-anchor="middle" font-size="16"><tspan x="180" dy="0">샘플 / target 0 / target 1</tspan></text><rect x="45" y="45" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="88.5" y="73" text-anchor="middle" font-size="16"><tspan x="88.5" dy="0">A</tspan></text><rect x="135" y="45" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="178.5" y="73" text-anchor="middle" font-size="16"><tspan x="178.5" dy="0">10</tspan></text><rect x="225" y="45" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="268.5" y="73" text-anchor="middle" font-size="16"><tspan x="268.5" dy="0">100</tspan></text><rect x="45" y="90" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="88.5" y="118" text-anchor="middle" font-size="16"><tspan x="88.5" dy="0">B</tspan></text><rect x="135" y="90" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="178.5" y="118" text-anchor="middle" font-size="16"><tspan x="178.5" dy="0">20</tspan></text><rect x="225" y="90" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="268.5" y="118" text-anchor="middle" font-size="16"><tspan x="268.5" dy="0">200</tspan></text><rect x="45" y="135" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="88.5" y="163" text-anchor="middle" font-size="16"><tspan x="88.5" dy="0">C</tspan></text><rect x="135" y="135" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="178.5" y="163" text-anchor="middle" font-size="16"><tspan x="178.5" dy="0">30</tspan></text><rect x="225" y="135" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="268.5" y="163" text-anchor="middle" font-size="16"><tspan x="268.5" dy="0">300</tspan></text><text x="180" y="218" text-anchor="middle" font-size="16"><tspan x="180" dy="0">출력 shape [3,2] + 열 순서 확인</tspan></text></g></svg>