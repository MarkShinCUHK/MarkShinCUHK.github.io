<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="figure-17-1-title figure-17-1-desc"><title id="figure-17-1-title">MLP: 각 층에서 섞고 비선형 변환한다</title><desc id="figure-17-1-desc">입력 3개, 은닉 유닛 4개, 출력 2개가 층 사이에서 모두 연결된 신경망이다. 출력 2개는 이 그림의 예시이며, 이진분류의 출력 형식은 사용하는 손실함수에 따라 다르다.</desc><rect width="360" height="260" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><line x1="42" y1="84" x2="180" y2="66" stroke="#c8d2de" stroke-width="2"/><line x1="42" y1="84" x2="180" y2="102" stroke="#c8d2de" stroke-width="2"/><line x1="42" y1="84" x2="180" y2="138" stroke="#c8d2de" stroke-width="2"/><line x1="42" y1="84" x2="180" y2="174" stroke="#c8d2de" stroke-width="2"/><line x1="42" y1="120" x2="180" y2="66" stroke="#c8d2de" stroke-width="2"/><line x1="42" y1="120" x2="180" y2="102" stroke="#c8d2de" stroke-width="2"/><line x1="42" y1="120" x2="180" y2="138" stroke="#c8d2de" stroke-width="2"/><line x1="42" y1="120" x2="180" y2="174" stroke="#c8d2de" stroke-width="2"/><line x1="42" y1="156" x2="180" y2="66" stroke="#c8d2de" stroke-width="2"/><line x1="42" y1="156" x2="180" y2="102" stroke="#c8d2de" stroke-width="2"/><line x1="42" y1="156" x2="180" y2="138" stroke="#c8d2de" stroke-width="2"/><line x1="42" y1="156" x2="180" y2="174" stroke="#c8d2de" stroke-width="2"/><line x1="180" y1="66" x2="318" y2="102" stroke="#c8d2de" stroke-width="2"/><line x1="180" y1="66" x2="318" y2="138" stroke="#c8d2de" stroke-width="2"/><line x1="180" y1="102" x2="318" y2="102" stroke="#c8d2de" stroke-width="2"/><line x1="180" y1="102" x2="318" y2="138" stroke="#c8d2de" stroke-width="2"/><line x1="180" y1="138" x2="318" y2="102" stroke="#c8d2de" stroke-width="2"/><line x1="180" y1="138" x2="318" y2="138" stroke="#c8d2de" stroke-width="2"/><line x1="180" y1="174" x2="318" y2="102" stroke="#c8d2de" stroke-width="2"/><line x1="180" y1="174" x2="318" y2="138" stroke="#c8d2de" stroke-width="2"/><circle cx="42" cy="84" r="11" fill="#1768df"/><circle cx="42" cy="120" r="11" fill="#1768df"/><circle cx="42" cy="156" r="11" fill="#1768df"/><text x="42" y="220" text-anchor="middle" font-size="16"><tspan x="42" dy="0">입력 3</tspan></text><circle cx="180" cy="66" r="11" fill="#1768df"/><circle cx="180" cy="102" r="11" fill="#1768df"/><circle cx="180" cy="138" r="11" fill="#1768df"/><circle cx="180" cy="174" r="11" fill="#1768df"/><text x="180" y="220" text-anchor="middle" font-size="16"><tspan x="180" dy="0">은닉 4</tspan></text><circle cx="318" cy="102" r="11" fill="#168765"/><circle cx="318" cy="138" r="11" fill="#168765"/><text x="318" y="220" text-anchor="middle" font-size="16"><tspan x="318" dy="0">출력 2</tspan></text></g></svg>