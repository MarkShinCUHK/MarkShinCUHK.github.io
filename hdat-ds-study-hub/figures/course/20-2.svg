<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 244" role="img" aria-labelledby="figure-20-2-title figure-20-2-desc"><title id="figure-20-2-title">전이학습에서 어느 층까지 학습할까?</title><desc id="figure-20-2-desc">사전학습 모델을 불러온 뒤 먼저 특징 추출부를 고정하고 출력층을 학습한다. 다음에는 필요에 따라 일부 층을 작은 학습률로 조정하고 검증 결과로 설정을 선택한다.</desc><rect width="360" height="244" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="28" y="14" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="39" text-anchor="middle" font-size="16"><tspan x="180" dy="0">사전학습 특징 추출부 불러오기</tspan></text><rect x="28" y="70" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="95" text-anchor="middle" font-size="16"><tspan x="180" dy="-9">1단계: 특징 추출부 고정, 출력층 </tspan><tspan x="180" dy="18">학습</tspan></text><line x1="180" y1="53" x2="180" y2="68" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,61.85692206676739 L180,68 L183.35597877022943,61.85692206676739" fill="none" stroke="#64748b" stroke-width="3"/><rect x="28" y="126" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="151" text-anchor="middle" font-size="16"><tspan x="180" dy="-9">2단계: 일부 층을 작은 학습률로 조</tspan><tspan x="180" dy="18">정</tspan></text><line x1="180" y1="109" x2="180" y2="124" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,117.8569220667674 L180,124 L183.35597877022943,117.8569220667674" fill="none" stroke="#64748b" stroke-width="3"/><rect x="28" y="182" width="304" height="39" rx="5" fill="#e6f7f1" stroke="#168765"/><text x="180" y="207" text-anchor="middle" font-size="16"><tspan x="180" dy="0">검증 결과로 고정할 층과 시점 선택</tspan></text><line x1="180" y1="165" x2="180" y2="180" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,173.8569220667674 L180,180 L183.35597877022943,173.8569220667674" fill="none" stroke="#64748b" stroke-width="3"/></g></svg>