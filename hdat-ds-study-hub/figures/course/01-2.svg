<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 305" role="img" aria-labelledby="figure-01-2-title figure-01-2-desc"><title id="figure-01-2-title">170분 운영의 한 가지 예</title><desc id="figure-01-2-desc">170분을 문제 확인 0–8분, Process 풀이 8–55분, 기준 모델과 개선 55–125분, 미완성 문제 125–150분, 제출 확인 150–170분으로 나눈 학습용 예시다.</desc><rect width="360" height="305" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="28" y="14" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="39" text-anchor="middle" font-size="16"><tspan x="180" dy="0">0–8분 · 문제·요구사항 읽기</tspan></text><rect x="28" y="70" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="95" text-anchor="middle" font-size="16"><tspan x="180" dy="0">8–55분 · Process 우선</tspan></text><line x1="180" y1="53" x2="180" y2="68" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,61.85692206676739 L180,68 L183.35597877022943,61.85692206676739" fill="none" stroke="#64748b" stroke-width="3"/><rect x="28" y="126" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="151" text-anchor="middle" font-size="16"><tspan x="180" dy="0">55–125분 · 기준 모델·개선</tspan></text><line x1="180" y1="109" x2="180" y2="124" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,117.8569220667674 L180,124 L183.35597877022943,117.8569220667674" fill="none" stroke="#64748b" stroke-width="3"/><rect x="28" y="182" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="207" text-anchor="middle" font-size="16"><tspan x="180" dy="0">125–150분 · 미완성 문제 풀기</tspan></text><line x1="180" y1="165" x2="180" y2="180" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,173.8569220667674 L180,180 L183.35597877022943,173.8569220667674" fill="none" stroke="#64748b" stroke-width="3"/><rect x="28" y="238" width="304" height="39" rx="5" fill="#e6f7f1" stroke="#168765"/><text x="180" y="263" text-a