<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="figure-13-1-title figure-13-1-desc"><title id="figure-13-1-title">시간 검증은 과거로 미래를 예측한다</title><desc id="figure-13-1-desc">첫 번째 분할은 시점 1–4로 학습하고 5–6으로 검증한다. 두 번째 분할은 1–6으로 학습하고 7–8로 검증한다. 파란색은 학습, 주황색은 검증 구간이다.</desc><rect width="360" height="260" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="8" y="56" text-anchor="start" font-size="16"><tspan x="8" dy="0">분할1</tspan></text><rect x="79" y="34" width="29" height="33" rx="5" fill="#d9eaff" stroke="#c8d2de"/><text x="93" y="57" text-anchor="middle" font-size="16"><tspan x="93" dy="0">1</tspan></text><rect x="111" y="34" width="29" height="33" rx="5" fill="#d9eaff" stroke="#c8d2de"/><text x="125" y="57" text-anchor="middle" font-size="16"><tspan x="125" dy="0">2</tspan></text><rect x="143" y="34" width="29" height="33" rx="5" fill="#d9eaff" stroke="#c8d2de"/><text x="157" y="57" text-anchor="middle" font-size="16"><tspan x="157" dy="0">3</tspan></text><rect x="175" y="34" width="29" height="33" rx="5" fill="#d9eaff" stroke="#c8d2de"/><text x="189" y="57" text-anchor="middle" font-size="16"><tspan x="189" dy="0">4</tspan></text><rect x="207" y="34" width="29" height="33" rx="5" fill="#ffe3d4" stroke="#c8d2de"/><text x="221" y="57" text-anchor="middle" font-size="16"><tspan x="221" dy="0">5</tspan></text><rect x="239" y="34" width="29" height="33" rx="5" fill="#ffe3d4" stroke="#c8d2de"/><text x="253" y="57" text-anchor="middle" font-size="16"><tspan x="253" dy="0">6</tspan></text><rect x="271" y="34" width="29" height="33" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="285" y="57" text-anchor="middle" font-size="16"><tspan x="285" dy="0">7</tspan></text><rect x="303" y="34" width="29" height="33" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="317" y="57" text-anchor="middle" font-size="16"><tspan x="317" dy="0">8</tspan></text><text x="8" y="108" text-anchor="start" font-size="16"><tspan x="8" dy="0">분할2</tspan></text><rect x="79" y="86" width="29" height="33" rx="5" fill="#d9eaff" stroke="#c8d2de"/><text x="93" y="109" text-anchor="middle" font-size="16"><tspan x="93" dy="0">1</tspan></text><rect x="111" y="86" width="29" height="33" rx="5" fill="#d9eaff" stroke="#c8d2de"/><text x="125" y="109" text-anchor="middle" font-size="16"><tspan x="125" dy="0">2</tspan></text><rect x="143" y="86" width="29" height="33" rx="5" fill="#d9eaff" stroke="#c8d2de"/><text x="157" y="109" text-anchor="middle" font-size="16"><tspan x="157" dy="0">3</tspan></text><rect x="175" y="86" width="29" height="33" rx="5" fill="#d9eaff" stroke="#c8d2de"/><text x="189" y="109" text-anchor="middle" font-size="16"><tspan x="189" dy="0">4</tspan></text><rect x="207" y="86" width="29" height="33" rx="5" fill="#d9eaff" stroke="#c8d2de"/><text x="221" y="109" text-anchor="middle" font-size="16"><tspan x="221" dy="0">5</tspan></text><rect x="239" y="86" width="29" height="33" rx="5" fill="#d9eaff" stroke="#c8d2de"/><text x="253" y="109" text-anchor="middle" font-size="16"><tspan x="253" dy="0">6</tspan></text><rect x="271" y="86" width="29" height="33" rx="5" fill="#ffe3d4" stroke="#c8d2de"/><text x="285" y="109" text-anchor="middle" font-size="16"><tspan x="285" dy="0">7</tspan></text><rect x="303" y="86" width="29" height="33" rx="5" fill="#ffe3d4" stroke="#c8d2de"/><text x="317" y="109" text-anchor="middle" font-size="16"><tspan x="317" dy="0">8</tspan></text><text x="180" y="170" text-anchor="middle" font-size="16"><tspan x="180" dy="0">파랑=학습 / 주황=검증</tspan></text><text x="180" y="210" text-anchor="middle" font-size="16"><tspan x="180" dy="0">예측 시점에 아는 정보만 사용</tspan></text></g></svg>