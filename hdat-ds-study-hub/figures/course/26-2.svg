<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 255" role="img" aria-labelledby="figure-26-2-title figure-26-2-desc"><title id="figure-26-2-title">CNN 명세의 공간 크기를 계산하기</title><desc id="figure-26-2-desc">입력32, kernel3,stride1,padding0이면30. kernel2stride2pool이면15. batch와channels는별도.</desc><rect width="360" height="255" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="28" y="14" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="39" text-anchor="middle" font-size="16"><tspan x="180" dy="0">입력 [B,3,32,32]</tspan></text><rect x="28" y="70" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="95" text-anchor="middle" font-size="16"><tspan x="180" dy="0">Conv2d(3→8, k=3, s=1, p=0)</tspan></text><line x1="180" y1="53" x2="180" y2="68" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,61.85692206676739 L180,68 L183.35597877022943,61.85692206676739" fill="none" stroke="#64748b" stroke-width="3"/><rect x="28" y="126" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="151" text-anchor="middle" font-size="16"><tspan x="180" dy="0">출력 [B,8,30,30]</tspan></text><line x1="180" y1="109" x2="180" y2="124" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,117.8569220667674 L180,124 L183.35597877022943,117.8569220667674" fill="none" stroke="#64748b" stroke-width="3"/><rect x="28" y="182" width="304" height="39" rx="5" fill="#e6f7f1" stroke="#168765"/><text x="180" y="207" text-anchor="middle" font-size="16"><tspan x="180" dy="0">MaxPool(k=2,s=2) → [B,8,15,15]</tspan></text><line x1="180" y1="165" x2="180" y2="180" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,173.8569220667674 L180,180 L183.35597877022943,173.8569220667674" fill="none" stroke="#64748b" stroke-width="3"/></g></svg>