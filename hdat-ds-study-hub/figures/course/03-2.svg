<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="figure-03-2-title figure-03-2-desc"><title id="figure-03-2-title">agg와 transform의 행 수가 다르다</title><desc id="figure-03-2-desc">그룹 A의 값 10과 30의 평균은 20이고, 그룹 B의 값 100의 평균은 100이다. agg는 그룹별 결과 2개를, transform은 원래 세 행에 대응하는 결과를 반환한다.</desc><rect width="360" height="260" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="180" y="29" text-anchor="middle" font-size="16"><tspan x="180" dy="0">ID / 원래 값 / transform</tspan></text><rect x="45" y="45" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="88.5" y="73" text-anchor="middle" font-size="16"><tspan x="88.5" dy="0">A</tspan></text><rect x="135" y="45" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="178.5" y="73" text-anchor="middle" font-size="16"><tspan x="178.5" dy="0">10</tspan></text><rect x="225" y="45" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="268.5" y="73" text-anchor="middle" font-size="16"><tspan x="268.5" dy="0">20</tspan></text><rect x="45" y="90" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="88.5" y="118" text-anchor="middle" font-size="16"><tspan x="88.5" dy="0">B</tspan></text><rect x="135" y="90" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="178.5" y="118" text-anchor="middle" font-size="16"><tspan x="178.5" dy="0">100</tspan></text><rect x="225" y="90" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="268.5" y="118" text-anchor="middle" font-size="16"><tspan x="268.5" dy="0">100</tspan></text><rect x="45" y="135" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="88.5" y="163" text-anchor="middle" font-size="16"><tspan x="88.5" dy="0">A</tspan></text><rect x="135" y="135" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="178.5" y="163" text-anchor="middle" font-size="16"><tspan x="178.5" dy="0">30</tspan></text><rect x="225" y="135" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="268.5" y="163" text-anchor="middle" font-size="16"><tspan x="268.5" dy="0">20</tspan></text><text x="180" y="221" text-anchor="middle" font-size="16"><tspan x="180" dy="0">agg → A:20, B:100 (2개)</tspan></text></g></svg>