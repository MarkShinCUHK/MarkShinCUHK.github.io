<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="figure-06-1-title figure-06-1-desc"><title id="figure-06-1-title">Bayes: 양성 안에서 실제 고장을 센다</title><desc id="figure-06-1-desc">1000개 중 실제 고장은 10개다. 민감도가 80%이면 진양성은 8개이고, 정상 990개의 오탐률이 10%이면 거짓양성은 99개다. 양성 107개 중 실제 고장은 8개다.</desc><rect width="360" height="260" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="180" y="29" text-anchor="middle" font-size="16"><tspan x="180" dy="0">실제 / 검사 + / 검사 −</tspan></text><rect x="30" y="45" width="97" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="78.5" y="73" text-anchor="middle" font-size="16"><tspan x="78.5" dy="0">고장</tspan></text><rect x="130" y="45" width="97" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="178.5" y="73" text-anchor="middle" font-size="16"><tspan x="178.5" dy="0">8</tspan></text><rect x="230" y="45" width="97" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="278.5" y="73" text-anchor="middle" font-size="16"><tspan x="278.5" dy="0">2</tspan></text><rect x="30" y="90" width="97" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="78.5" y="118" text-anchor="middle" font-size="16"><tspan x="78.5" dy="0">정상</tspan></text><rect x="130" y="90" width="97" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="178.5" y="118" text-anchor="middle" font-size="16"><tspan x="178.5" dy="0">99</tspan></text><rect x="230" y="90" width="97" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="278.5" y="118" text-anchor="middle" font-size="16"><tspan x="278.5" dy="0">891</tspan></text><text x="180" y="181" text-anchor="middle" font-size="16"><tspan x="180" dy="0">양성: 8 + 99 = 107</tspan></text><text x="180" y="217" text-anchor="middle" font-size="16"><tspan x="180" dy="0">P(고장 | +) = 8/107 ≈ 7.5%</tspan></text></g></svg>