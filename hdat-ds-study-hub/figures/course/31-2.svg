<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="figure-31-2-title figure-31-2-desc"><title id="figure-31-2-title">정확도만 보면 놓치는 소수 클래스</title><desc id="figure-31-2-desc">100개 중 정상은 95개, 불량은 5개다. 모두 정상이라고 예측하면 정확도는 95%지만 불량 재현율은 0%다.</desc><rect width="360" height="260" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="180" y="48" text-anchor="middle" font-size="16"><tspan x="180" dy="0">예측 불량       예측 정상</tspan></text><rect x="80" y="64" width="102" height="52" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="131" y="92" text-anchor="middle" font-size="16"><tspan x="131" dy="0">0</tspan></text><rect x="185" y="64" width="102" height="52" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="236" y="92" text-anchor="middle" font-size="16"><tspan x="236" dy="0">5</tspan></text><rect x="80" y="119" width="102" height="52" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="131" y="147" text-anchor="middle" font-size="16"><tspan x="131" dy="0">0</tspan></text><rect x="185" y="119" width="102" height="52" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="236" y="147" text-anchor="middle" font-size="16"><tspan x="236" dy="0">95</tspan></text><text x="40" y="98" text-anchor="middle" font-size="16"><tspan x="40" dy="0">불량</tspan></text><text x="40" y="153" text-anchor="middle" font-size="16"><tspan x="40" dy="0">정상</tspan></text><text x="180" y="220" text-anchor="middle" font-size="16"><tspan x="180" dy="0">Accuracy 95% / 불량 Recall 0%</tspan></text></g></svg>