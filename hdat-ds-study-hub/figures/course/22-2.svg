<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 244" role="img" aria-labelledby="figure-22-2-title figure-22-2-desc"><title id="figure-22-2-title">LSTM은 기존 기억과 새 후보를 섞는다</title><desc id="figure-22-2-desc">기존 셀 상태에 망각 게이트를, 새 후보에 입력 게이트를 곱해 더한다. 이렇게 만든 새 셀 상태로부터 출력 게이트를 거쳐 은닉 상태를 계산한다.</desc><rect width="360" height="244" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="28" y="14" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="39" text-anchor="middle" font-size="16"><tspan x="180" dy="-9">기존 셀 상태 cₜ₋₁ × 망각 게이트 </tspan><tspan x="180" dy="18">fₜ</tspan></text><rect x="28" y="70" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="95" text-anchor="middle" font-size="16"><tspan x="180" dy="0">새 후보 gₜ × 입력 게이트 iₜ</tspan></text><line x1="180" y1="53" x2="180" y2="68" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,61.85692206676739 L180,68 L183.35597877022943,61.85692206676739" fill="none" stroke="#64748b" stroke-width="3"/><rect x="28" y="126" width="304" height="39" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="151" text-anchor="middle" font-size="16"><tspan x="180" dy="0">두 항을 더해 새 기억 cₜ</tspan></text><line x1="180" y1="109" x2="180" y2="124" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,117.8569220667674 L180,124 L183.35597877022943,117.8569220667674" fill="none" stroke="#64748b" stroke-width="3"/><rect x="28" y="182" width="304" height="39" rx="5" fill="#e6f7f1" stroke="#168765"/><text x="180" y="207" text-anchor="middle" font-size="16"><tspan x="180" dy="0">출력 게이트 oₜ × tanh(cₜ) → hₜ</tspan></text><line x1="180" y1="165" x2="180" y2="180" stroke="#64748b" stroke-width="2"/><path d="M176.64402122977057,173.8569220667674 L180,180 L183.35597877022943,173.8569220667674" fill="none" stroke="#64748b" stroke-width="3"/></g></svg>