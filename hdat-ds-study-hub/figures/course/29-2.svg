<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 235" role="img" aria-labelledby="figure-29-2-title figure-29-2-desc"><title id="figure-29-2-title">분류와 이상탐지는 목적부터 다르다</title><desc id="figure-29-2-desc">왼쪽은 label로 분류, 오른쪽은 정상 위주로 AE를 학습하는 대안이다. 두 방법을 반드시 연달아 실행한다는 뜻이 아니다.</desc><rect width="360" height="235" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="28" y="14" width="304" height="50" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="45" text-anchor="middle" font-size="16"><tspan x="180" dy="0">데이터와 목표에 맞는 방법 선택</tspan></text><line x1="125" y1="66" x2="92" y2="96" stroke="#64748b" stroke-width="2"/><path d="M94.2880339208306,89.38449542535653 L92,96 L98.80298515275567,94.35094178047412" fill="none" stroke="#64748b" stroke-width="3"/><line x1="235" y1="66" x2="268" y2="96" stroke="#64748b" stroke-width="2"/><path d="M261.1970148472443,94.35094178047412 L268,96 L265.7119660791694,89.38449542535655" fill="none" stroke="#64748b" stroke-width="3"/><rect x="10" y="101" width="164" height="109" rx="5" fill="#eaf3ff" stroke="#1768df"/><rect x="186" y="101" width="164" height="109" rx="5" fill="#e6f7f1" stroke="#168765"/><text x="92" y="131" text-anchor="middle" font-size="16"><tspan x="92" dy="0">label로 분류</tspan></text><text x="92" y="177" text-anchor="middle" font-size="16"><tspan x="92" dy="-9">logits → class/</tspan><tspan x="92" dy="18">확률</tspan></text><text x="268" y="131" text-anchor="middle" font-size="16"><tspan x="268" dy="0">정상 위주 AE</tspan></text><text x="268" y="177" text-anchor="middle" font-size="16"><tspan x="268" dy="-9">복원 오차 → 이상 </tspan><tspan x="268" dy="18">점수</tspan></text></g></svg>