<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="figure-32-1-title figure-32-1-desc"><title id="figure-32-1-title">상수 열은 Min-Max 분모가 0이다</title><desc id="figure-32-1-desc">값이 5, 5, 5인 열에서는 최솟값과 최댓값이 모두 5다. Min-Max 공식을 그대로 적용하면 0/0이므로, 상수 열을 어떻게 반환할지 문제 조건을 확인해야 한다.</desc><rect width="360" height="260" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="180" y="29" text-anchor="middle" font-size="16"><tspan x="180" dy="0">원래 값 / 공식만 적용</tspan></text><rect x="78" y="45" width="102" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="129" y="73" text-anchor="middle" font-size="16"><tspan x="129" dy="0">5</tspan></text><rect x="183" y="45" width="102" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="234" y="73" text-anchor="middle" font-size="16"><tspan x="234" dy="0">0/0</tspan></text><rect x="78" y="90" width="102" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="129" y="118" text-anchor="middle" font-size="16"><tspan x="129" dy="0">5</tspan></text><rect x="183" y="90" width="102" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="234" y="118" text-anchor="middle" font-size="16"><tspan x="234" dy="0">0/0</tspan></text><rect x="78" y="135" width="102" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="129" y="163" text-anchor="middle" font-size="16"><tspan x="129" dy="0">5</tspan></text><rect x="183" y="135" width="102" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="234" y="163" text-anchor="middle" font-size="16"><tspan x="234" dy="0">0/0</tspan></text><text x="180" y="220" text-anchor="middle" font-size="16"><tspan x="180" dy="0">반환 정책은 문제 명세로 결정</tspan></text></g></svg>