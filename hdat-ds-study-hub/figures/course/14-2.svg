<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="figure-14-2-title figure-14-2-desc"><title id="figure-14-2-title">ROC는 threshold를 움직인 흔적</title><desc id="figure-14-2-desc">합성ROC 좌표(0,0),(0,.5),(.25,.75),(.5,1),(1,1). 점선은대각선기준.</desc><rect width="360" height="260" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><line x1="50" y1="33" x2="50" y2="207" stroke="#64748b" stroke-width="2"/><line x1="50" y1="207" x2="330" y2="207" stroke="#64748b" stroke-width="2"/><text x="190" y="248" text-anchor="middle" font-size="16"><tspan x="190" dy="0">FPR = FP / 실제 음성</tspan></text><text x="12" y="22" text-anchor="start" font-size="16"><tspan x="12" dy="0">TPR</tspan></text><line x1="50" y1="207" x2="50" y2="212" stroke="#64748b" stroke-width="2"/><text x="50" y="230" text-anchor="middle" font-size="16"><tspan x="50" dy="0">0</tspan></text><line x1="190" y1="207" x2="190" y2="212" stroke="#64748b" stroke-width="2"/><text x="190" y="230" text-anchor="middle" font-size="16"><tspan x="190" dy="0">0.5</tspan></text><line x1="330" y1="207" x2="330" y2="212" stroke="#64748b" stroke-width="2"/><text x="330" y="230" text-anchor="middle" font-size="16"><tspan x="330" dy="0">1</tspan></text><line x1="45" y1="207" x2="50" y2="207" stroke="#64748b" stroke-width="2"/><text x="41" y="212" text-anchor="end" font-size="16"><tspan x="41" dy="0">0</tspan></text><line x1="45" y1="120" x2="50" y2="120" stroke="#64748b" stroke-width="2"/><text x="41" y="125" text-anchor="end" font-size="16"><tspan x="41" dy="0">0.5</tspan></text><line x1="45" y1="33" x2="50" y2="33" stroke="#64748b" stroke-width="2"/><text x="41" y="38" text-anchor="end" font-size="16"><tspan x="41" dy="0">1</tspan></text><path d="M50,207 L50,120 L120,76.5 L190,33 L330,33" fill="none" stroke="#1768df" stroke-width="3"/><path d="M50,207 L330,33" fill="none" stroke="#b44a2d" stroke-width="3" stroke-dasharray="4 4"/></g></svg>