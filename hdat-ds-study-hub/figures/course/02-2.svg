<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="figure-02-2-title figure-02-2-desc"><title id="figure-02-2-title">broadcasting은 값을 반복 적용한다</title><desc id="figure-02-2-desc">2행3열 배열에 길이3 보정값을 더한다. 각 행의 같은 열에 같은 보정값이 적용된다.</desc><rect width="360" height="260" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="180" y="29" text-anchor="middle" font-size="16"><tspan x="180" dy="0">X: [2,3]</tspan></text><rect x="52" y="45" width="82" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="93" y="73" text-anchor="middle" font-size="16"><tspan x="93" dy="0">1</tspan></text><rect x="137" y="45" width="82" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="178" y="73" text-anchor="middle" font-size="16"><tspan x="178" dy="0">2</tspan></text><rect x="222" y="45" width="82" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="263" y="73" text-anchor="middle" font-size="16"><tspan x="263" dy="0">3</tspan></text><rect x="52" y="90" width="82" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="93" y="118" text-anchor="middle" font-size="16"><tspan x="93" dy="0">4</tspan></text><rect x="137" y="90" width="82" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="178" y="118" text-anchor="middle" font-size="16"><tspan x="178" dy="0">5</tspan></text><rect x="222" y="90" width="82" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="263" y="118" text-anchor="middle" font-size="16"><tspan x="263" dy="0">6</tspan></text><text x="180" y="169" text-anchor="middle" font-size="16"><tspan x="180" dy="0">+ [10,20,30]</tspan></text><text x="180" y="211" text-anchor="middle" font-size="16"><tspan x="180" dy="0">[11,22,33]</tspan></text><text x="180" y="241" text-anchor="middle" font-size="16"><tspan x="180" dy="0">[14,25,36]</tspan></text></g></svg>