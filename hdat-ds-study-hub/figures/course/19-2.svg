<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 280" role="img" aria-labelledby="figure-19-2-title figure-19-2-desc"><title id="figure-19-2-title">convolution 결과와 pooling 결과 비교</title><desc id="figure-19-2-desc">같은 3×3 입력에 2×2 합성곱 필터를 적용한 결과는 [[6,8],[12,14]]이다. 이 입력에 보폭 1인 2×2 최대 풀링을 따로 적용하면 [[5,6],[8,9]]가 된다.</desc><rect width="360" height="280" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="180" y="32" text-anchor="middle" font-size="16"><tspan x="180" dy="0">Conv: 곱해서 더하기</tspan></text><rect x="90" y="48" width="87" height="39" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="133.5" y="76" text-anchor="middle" font-size="16"><tspan x="133.5" dy="0">6</tspan></text><rect x="180" y="48" width="87" height="39" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="223.5" y="76" text-anchor="middle" font-size="16"><tspan x="223.5" dy="0">8</tspan></text><rect x="90" y="90" width="87" height="39" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="133.5" y="118" text-anchor="middle" font-size="16"><tspan x="133.5" dy="0">12</tspan></text><rect x="180" y="90" width="87" height="39" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="223.5" y="118" text-anchor="middle" font-size="16"><tspan x="223.5" dy="0">14</tspan></text><text x="180" y="160" text-anchor="middle" font-size="16"><tspan x="180" dy="0">MaxPool: 창 안 최댓값</tspan></text><rect x="90" y="176" width="87" height="39" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="133.5" y="204" text-anchor="middle" font-size="16"><tspan x="133.5" dy="0">5</tspan></text><rect x="180" y="176" width="87" height="39" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="223.5" y="204" text-anchor="middle" font-size="16"><tspan x="223.5" dy="0">6</tspan></text><rect x="90" y="218" width="87" height="39" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="133.5" y="246" text-anchor="middle" font-size="16"><tspan x="133.5" dy="0">8</tspan></text><rect x="180" y="218" width="87" height="39" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="223.5" y="246" text-anchor="middle" font-size="16"><tspan x="223.5" dy="0">9</tspan></text></g></svg>