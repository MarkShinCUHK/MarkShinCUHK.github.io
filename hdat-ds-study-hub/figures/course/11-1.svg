<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="figure-11-1-title figure-11-1-desc"><title id="figure-11-1-title">결정트리는 질문으로 영역을 나눈다</title><desc id="figure-11-1-desc">온도>80?이면고장쪽, 아니면진동>3?을확인. 학습용단순규칙이며실제모델성능주장없음.</desc><rect width="360" height="260" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="100" y="15" width="160" height="40" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="41" text-anchor="middle" font-size="16"><tspan x="180" dy="0">온도 > 80?</tspan></text><line x1="145" y1="57" x2="75" y2="103" stroke="#64748b" stroke-width="2"/><path d="M78.29077456232125,96.82174759499262 L75,103 L81.9768332197477,102.43096729107636" fill="none" stroke="#64748b" stroke-width="3"/><line x1="215" y1="57" x2="285" y2="103" stroke="#64748b" stroke-width="2"/><path d="M278.0231667802523,102.43096729107636 L285,103 L281.70922543767875,96.82174759499262" fill="none" stroke="#64748b" stroke-width="3"/><text x="70" y="82" text-anchor="middle" font-size="16"><tspan x="70" dy="0">아니오</tspan></text><text x="290" y="82" text-anchor="middle" font-size="16"><tspan x="290" dy="0">예</tspan></text><rect x="12" y="108" width="145" height="40" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="85" y="134" text-anchor="middle" font-size="16"><tspan x="85" dy="0">진동 > 3?</tspan></text><rect x="235" y="108" width="110" height="40" rx="5" fill="#fff6df" stroke="#c87908"/><text x="290" y="134" text-anchor="middle" font-size="16"><tspan x="290" dy="0">고장 후보</tspan></text><line x1="48" y1="150" x2="48" y2="192" stroke="#64748b" stroke-width="2"/><path d="M44.64402122977058,185.8569220667674 L48,192 L51.35597877022942,185.8569220667674" fill="none" stroke="#64748b" stroke-width="3"/><text x="86" y="180" text-anchor="middle" font-size="16"><tspan x="86" dy="0">아니오</tspan></text><line x1="128" y1="150" x2="168" y2="192" stroke="#64748b" stroke-width="2"/><path d="M161.33320300553552,189.8660323