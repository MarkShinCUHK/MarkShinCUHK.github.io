<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 235" role="img" aria-labelledby="figure-09-1-title figure-09-1-desc"><title id="figure-09-1-title">열 선택과 새 축 만들기는 다르다</title><desc id="figure-09-1-desc">선택은온도압력진동에서원래열일부를고른다. 추출은여러열을조합해새좌표를만든다.</desc><rect width="360" height="235" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><rect x="28" y="14" width="304" height="50" rx="5" fill="#eaf3ff" stroke="#1768df"/><text x="180" y="45" text-anchor="middle" font-size="16"><tspan x="180" dy="0">원래 입력: 온도·압력·진동</tspan></text><line x1="125" y1="66" x2="92" y2="96" stroke="#64748b" stroke-width="2"/><path d="M94.2880339208306,89.38449542535653 L92,96 L98.80298515275567,94.35094178047412" fill="none" stroke="#64748b" stroke-width="3"/><line x1="235" y1="66" x2="268" y2="96" stroke="#64748b" stroke-width="2"/><path d="M261.1970148472443,94.35094178047412 L268,96 L265.7119660791694,89.38449542535655" fill="none" stroke="#64748b" stroke-width="3"/><rect x="10" y="101" width="164" height="109" rx="5" fill="#eaf3ff" stroke="#1768df"/><rect x="186" y="101" width="164" height="109" rx="5" fill="#e6f7f1" stroke="#168765"/><text x="92" y="131" text-anchor="middle" font-size="16"><tspan x="92" dy="0">Selection · 선택</tspan></text><text x="92" y="177" text-anchor="middle" font-size="16"><tspan x="92" dy="0">온도 · 진동</tspan></text><text x="268" y="131" text-anchor="middle" font-size="16"><tspan x="268" dy="-9">Extraction · 추</tspan><tspan x="268" dy="18">출</tspan></text><text x="268" y="177" text-anchor="middle" font-size="16"><tspan x="268" dy="0">z=a×온도+b×압력</tspan></text></g></svg>