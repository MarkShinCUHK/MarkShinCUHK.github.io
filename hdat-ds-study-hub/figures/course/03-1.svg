<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="figure-03-1-title figure-03-1-desc"><title id="figure-03-1-title">merge: 이름표를 맞춰 정보를 붙이기</title><desc id="figure-03-1-desc">왼쪽 표의 ID가 A, B, A이고 오른쪽 표의 정보가 A에 1000, B에 1500일 때, 다대일 병합 결과는 원래와 같은 세 행이다.</desc><rect width="360" height="260" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="180" y="29" text-anchor="middle" font-size="16"><tspan x="180" dy="0">ID / speed / weight</tspan></text><rect x="45" y="45" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="88.5" y="73" text-anchor="middle" font-size="16"><tspan x="88.5" dy="0">A</tspan></text><rect x="135" y="45" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="178.5" y="73" text-anchor="middle" font-size="16"><tspan x="178.5" dy="0">10</tspan></text><rect x="225" y="45" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="268.5" y="73" text-anchor="middle" font-size="16"><tspan x="268.5" dy="0">1000</tspan></text><rect x="45" y="90" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="88.5" y="118" text-anchor="middle" font-size="16"><tspan x="88.5" dy="0">B</tspan></text><rect x="135" y="90" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="178.5" y="118" text-anchor="middle" font-size="16"><tspan x="178.5" dy="0">20</tspan></text><rect x="225" y="90" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="268.5" y="118" text-anchor="middle" font-size="16"><tspan x="268.5" dy="0">1500</tspan></text><rect x="45" y="135" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="88.5" y="163" text-anchor="middle" font-size="16"><tspan x="88.5" dy="0">A</tspan></text><rect x="135" y="135" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="178.5" y="163" text-anchor="middle" font-size="16"><tspan x="178.5" dy="0">30</tspan></text><rect x="225" y="135" width="87" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="268.5" y="163" text-anchor="middle" font-size="16"><tspan x="268.5" dy="0">1000</tspan></text><text x="180" y="222" text-anchor="middle" font-size="16"><tspan x="180" dy="0">A의 정보는 두 기록에 재사용</tspan></text></g></svg>