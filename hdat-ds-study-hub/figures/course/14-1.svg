<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="figure-14-1-title figure-14-1-desc"><title id="figure-14-1-title">혼동행렬에서 분모를 직접 고른다</title><desc id="figure-14-1-desc">실제 양성 행에는 진양성 8개와 거짓음성 2개, 실제 음성 행에는 거짓양성 3개와 진음성 7개가 있다. 정밀도는 8/11, 재현율은 8/10이다.</desc><rect width="360" height="260" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="180" y="49" text-anchor="middle" font-size="16"><tspan x="180" dy="0">예측 +             예측 −</tspan></text><rect x="85" y="65" width="92" height="52" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="131" y="93" text-anchor="middle" font-size="16"><tspan x="131" dy="0">8</tspan></text><rect x="180" y="65" width="92" height="52" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="226" y="93" text-anchor="middle" font-size="16"><tspan x="226" dy="0">2</tspan></text><rect x="85" y="120" width="92" height="52" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="131" y="148" text-anchor="middle" font-size="16"><tspan x="131" dy="0">3</tspan></text><rect x="180" y="120" width="92" height="52" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="226" y="148" text-anchor="middle" font-size="16"><tspan x="226" dy="0">7</tspan></text><text x="43" y="99" text-anchor="middle" font-size="16"><tspan x="43" dy="0">실제 +</tspan></text><text x="43" y="154" text-anchor="middle" font-size="16"><tspan x="43" dy="0">실제 −</tspan></text><text x="180" y="212" text-anchor="middle" font-size="16"><tspan x="180" dy="0">Precision = 8/11</tspan></text><text x="180" y="243" text-anchor="middle" font-size="16"><tspan x="180" dy="0">Recall = 8/10</tspan></text></g></svg>