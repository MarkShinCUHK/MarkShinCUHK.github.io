<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 260" role="img" aria-labelledby="figure-08-1-title figure-08-1-desc"><title id="figure-08-1-title">스케일을 바꿔도 샘플의 대응은 그대로</title><desc id="figure-08-1-desc">원래 값 10, 20, 30에 최솟값 10과 최댓값 30을 사용한 Min-Max 변환을 적용하면 각각 0, 0.5, 1이 된다.</desc><rect width="360" height="260" fill="#fff"/><g fill="#13203a" font-family="Arial, Apple SD Gothic Neo, Malgun Gothic, sans-serif"><text x="180" y="29" text-anchor="middle" font-size="16"><tspan x="180" dy="0">원래 값 → Min-Max 값</tspan></text><rect x="72" y="45" width="107" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="125.5" y="73" text-anchor="middle" font-size="16"><tspan x="125.5" dy="0">10</tspan></text><rect x="182" y="45" width="107" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="235.5" y="73" text-anchor="middle" font-size="16"><tspan x="235.5" dy="0">0</tspan></text><rect x="72" y="90" width="107" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="125.5" y="118" text-anchor="middle" font-size="16"><tspan x="125.5" dy="0">20</tspan></text><rect x="182" y="90" width="107" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="235.5" y="118" text-anchor="middle" font-size="16"><tspan x="235.5" dy="0">0.5</tspan></text><rect x="72" y="135" width="107" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="125.5" y="163" text-anchor="middle" font-size="16"><tspan x="125.5" dy="0">30</tspan></text><rect x="182" y="135" width="107" height="42" rx="5" fill="#f5f7fa" stroke="#c8d2de"/><text x="235.5" y="163" text-anchor="middle" font-size="16"><tspan x="235.5" dy="0">1</tspan></text><text x="180" y="220" text-anchor="middle" font-size="16"><tspan x="180" dy="0">(x−10)/(30−10)</tspan></text></g></svg>